variables:
  - name: AccountName
    description: AWS Account name
    type: string
    
  - name: AccountId
    description: AWS Account ID
    type: string
    
  - name: CreateVPC
    description: Whether to create VPC configuration
    type: bool
    default: false
    
  - name: VPCCidr
    description: VPC CIDR block
    type: string
    default: "10.0.0.0/16"
    
  - name: HasEuWest1
    description: Whether this account should have eu-west-1 region
    type: bool
    default: false

dependencies:
  - name: us-east-1-region
    template-url: ./dependencies/region
    output-folder: ./us-east-1
    variables:
      - name: RegionName
        default: "us-east-1"
      - name: AccountName
        reference: AccountName
      - name: CreateVPC
        reference: CreateVPC
      - name: VPCCidr
        reference: VPCCidr

  - name: eu-west-1-region
    template-url: ./dependencies/region
    output-folder: ./eu-west-1
    skip: "{{ not .HasEuWest1 }}"
    variables:
      - name: RegionName
        default: "eu-west-1"
      - name: AccountName
        reference: AccountName
      - name: CreateVPC
        reference: CreateVPC
      - name: VPCCidr
        reference: VPCCidr