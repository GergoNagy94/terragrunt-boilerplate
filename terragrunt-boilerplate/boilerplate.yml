variables:
  - name: ProjectName
    description: Enter the name of your project
    type: string
    default: "terragrunt"

  - name: ProjectVersion
    description: Enter the initial project version
    type: string
    default: "v1.0.0"

  - name: OrganizationId
    description: Enter your AWS Organization ID
    type: string
    default: "o-00000000000"

  - name: OrganizationRootId
    description: Enter your AWS Organization Root ID
    type: string
    default: "r-0000"

  - name: DomainName
    description: Enter your domain name for email addresses
    type: string
    default: "example.com"

  - name: DevelopmentAccountId
    description: Development AWS Account ID
    type: string
    default: "000000000000"

  - name: ManagementAccountId
    description: Management AWS Account ID
    type: string
    default: "000000000000"

  - name: MonitoringAccountId
    description: Monitoring AWS Account ID
    type: string
    default: "000000000000"

  - name: ProductionAccountId
    description: Production AWS Account ID
    type: string
    default: "000000000000"

  - name: DefaultRegion
    description: Enter the default AWS region
    type: string
    default: "us-east-1"

  - name: StateRegion
    description: Enter the AWS region for Terraform state storage
    type: string
    default: "us-east-1"

  - name: CreateVPC
    description: Create VPC configuration?
    type: bool
    default: true

  - name: VPCCidr
    description: VPC CIDR block
    type: string
    default: "10.0.0.0/16"

skip_files:
  - path: "./account-template/**/*"

dependencies:
  - name: development
    template-url: ./account-template
    output-folder: ./live/development
    variables:
      - name: AccountName
        default: "development"
      - name: AccountId
        default: "{{ .DevelopmentAccountId }}"
      - name: CreateVPC
        default: "false"
      - name: VPCCidr
        default: "{{ .VPCCidr }}"
      - name: IncludeEuWest1
        default: true

  - name: management
    template-url: ./account-template
    output-folder: ./live/management
    variables:
      - name: AccountName
        default: "management"
      - name: AccountId
        default: "{{ .ManagementAccountId }}"
      - name: CreateVPC
        default: "false"     
      - name: VPCCidr
        default: "{{ .VPCCidr }}"
      - name: IncludeEuWest1
        default: true

  - name: monitoring
    template-url: ./account-template
    output-folder: ./live/monitoring
    variables:
      - name: AccountName
        default: "monitoring"
      - name: AccountId
        default: "{{ .MonitoringAccountId }}"
      - name: CreateVPC
        default: "false"
      - name: VPCCidr
        default: "{{ .VPCCidr }}"
      - name: IncludeEuWest1
        default: true

  - name: production
    template-url: ./account-template
    output-folder: ./live/production
    variables:
      - name: AccountName
        default: "production"
      - name: AccountId
        default: "{{ .ProductionAccountId }}"
      - name: CreateVPC
        default: "false"
      - name: VPCCidr
        default: "{{ .VPCCidr }}"
      - name: IncludeEuWest1
        default: true