variables:
  - name: ProjectName
    description: Enter the name of your project
    type: string
    default: "terragrunt"

  - name: DevelopmentAccountId
    description: Development AWS Account ID
    type: string
    default: "000000000000"

  - name: ManagementAccountId
    description: Management AWS Account ID  
    type: string
    default: "000000000000"

  - name: MonitoringAccountId
    description: Monitoring AWS Account ID
    type: string
    default: "000000000000"

  - name: ProductionAccountId
    description: Production AWS Account ID
    type: string
    default: "000000000000"

  - name: CreateVPC
    description: Create VPC configuration?
    type: bool
    default: true

  - name: VPCCidr
    description: VPC CIDR block
    type: string
    default: "10.0.0.0/16"

dependencies:
  - name: development
    template-url: ./account-template
    output-folder: ./live/development
    variables:
      - name: AccountName
        default: "development"
      - name: AccountId
        default: "{{ .DevelopmentAccountId }}"
      - name: CreateVPC
        reference: CreateVPC
      - name: VPCCidr
        reference: VPCCidr
      - name: IncludeEuWest1
        default: true

  - name: management
    template-url: ./account-template
    output-folder: ./live/management
    variables:
      - name: AccountName
        default: "management"
      - name: AccountId
        default: "{{ .ManagementAccountId }}"
      - name: CreateVPC
        default: false
      - name: VPCCidr
        reference: VPCCidr
      - name: IncludeEuWest1
        default: false